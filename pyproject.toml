[project]
name = "credit-engine"
version = "0.1.0"
description = "Credit analytics engine: Bloomberg data loading, OIS curves, CDX pricing and price-to-spread mapping."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "pyarrow>=14",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["credit_engine*"]
